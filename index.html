<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>뿌요뿌요</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <h1>뿌요뿌요</h1>
        <div class="game-info">
            <div class="score-panel">
                <div>점수: <span id="score">0</span></div>
                <div>연쇄: <span id="chain">0</span></div>
            </div>
            <div class="next-panel">
                <div>다음 뿌요</div>
                <canvas id="next-canvas" width="80" height="120"></canvas>
            </div>
        </div>
        <div class="board-container">
            <canvas id="game-canvas" width="300" height="650"></canvas>
        </div>
        <div class="controls">
            <p>← → : 이동 | ↑ : 회전 | ↓ : 빠른 낙하 | Space : 하드 드롭</p>
            <button id="start-btn">게임 시작</button>
            <button id="pause-btn" disabled>일시정지</button>
            <button id="restart-btn" disabled>재시작</button>
        </div>
        <div id="game-over" class="hidden">
            <h2>게임 오버!</h2>
            <p>최종 점수: <span id="final-score">0</span></p>
            <button id="retry-btn">다시 시작</button>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
